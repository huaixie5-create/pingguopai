<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <title>文游</title> <!-- ============================================================ 第 1 步：骨架 这个文件分三块： 1. <style> 管长相（颜色、布局） 2. <body> 管内容（四个页面 + 底栏） 3. <script> 管行为（点底栏切换页面） 后面每一步，我们都只是往这三块里加东西。 ============================================================ --> <style> /* ---------- 颜色和字体：想换风格，改这里就行 ---------- */ :root { --paper: #EEF2EE; /* 页面底色，淡淡的梨花青白 */ --card: #FAFBF9; /* 卡片、输入框的底色 */ --ink: #262B28; /* 正文墨色 */ --soft: #6B746E; /* 次要文字 */ --line: #D5DCD6; /* 分割线 */ --accent: #4F6F62; /* 强调色，青灰绿 */ --title-font: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif; } * { box-sizing: border-box; margin: 0; padding: 0; } html, body { height: 100%; } body { display: flex; flex-direction: column; height: 100dvh; /* 手机上刚好一屏高 */ background: var(--paper); color: var(--ink); font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; font-size: 16px; line-height: 1.6; } /* ---------- 页面区域 ---------- */ main { flex: 1; min-height: 0; position: relative; } .page { display: none; /* 默认都藏起来 */ flex-direction: column; height: 100%; } .page.active { display: flex; } /* 只有带 active 的显示 */ .page-head { padding: 18px 20px 12px; padding-top: max(18px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); } .page-head h1 { font-family: var(--title-font); font-size: 24px; font-weight: 600; letter-spacing: 0.12em; } .page-head p { font-size: 14px; color: var(--soft); } .page-body { flex: 1; overflow-y: auto; padding: 20px; } /* 空页面时的提示 */ .empty { margin-top: 12vh; text-align: center; color: var(--soft); font-size: 15px; } .empty strong { display: block; margin-bottom: 6px; font-family: var(--title-font); font-size: 18px; font-weight: 600; color: var(--ink); } /* ---------- 世界页：消息 + 输入框 ---------- */ .log { flex: 1; overflow-y: auto; padding: 16px 20px; } .msg { max-width: 85%; margin-bottom: 12px; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; /* 保留换行 */ word-break: break-word; } .msg.user { margin-left: auto; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; } .msg.sys { margin-right: auto; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; } .composer { display: flex; gap: 10px; align-items: flex-end; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--paper); } .composer textarea { flex: 1; max-height: 120px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: inherit; /* 16px，iPhone 不会自动放大页面 */ resize: none; } .composer button { padding: 10px 18px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; } /* ---------- 底栏 ---------- */ nav { display: flex; border-top: 1px solid var(--line); background: var(--card); padding-bottom: env(safe-area-inset-bottom); /* 避开手机底部小横条 */ } .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0 8px; border: 0; background: none; color: var(--soft); font: inherit; font-size: 13px; cursor: pointer; } .tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; } .tab.active { color: var(--accent); font-weight: 600; } button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; } </style> </head> <body> <main> <!-- ========== 世界 ========== --> <section class="page" id="page-world"> <header class="page-head"> <h1>世界</h1> </header> <div class="log" id="log"> <div class="msg sys">欢迎来到这里。输入一条指令，试试看。（现在还没接 API，所以只会回显你的话。）</div> </div> <div class="composer"> <textarea id="input" rows="1" placeholder="输入指令……"></textarea> <button id="send">发送</button> </div> </section> <!-- ========== 面具 ========== --> <section class="page" id="page-mask"> <header class="page-head"> <h1>面具</h1> <p>存放你扮演的人设</p> </header> <div class="page-body"> <div class="empty"><strong>还没有面具</strong>第 4 步会在这里新建和管理人设。</div> </div> </section> <!-- ========== 预设 ========== --> <section class="page" id="page-preset"> <header class="page-head"> <h1>预设</h1> <p>导入、导出、编辑酒馆格式预设</p> </header> <div class="page-body"> <div class="empty"><strong>还没有预设</strong>第 5 步会在这里导入酒馆 JSON，并编辑条目。</div> </div> </section> <!-- ========== 设置 ========== --> <section class="page" id="page-settings"> <header class="page-head"> <h1>设置</h1> <p>连接 API</p> </header> <div class="page-body"> <div class="empty"><strong>还没有连接 API</strong>第 2 步会在这里填写地址、Key 和模型名。</div> </div> </section> </main> <!-- ========== 底栏 ========== --> <nav> <button class="tab" data-page="world"> <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg> 世界 </button> <button class="tab" data-page="mask"> <svg viewBox="0 0 24 24"><path d="M4 5c5 2 11 2 16 0v6c0 5-3.5 8-8 8s-8-3-8-8z"/><path d="M8.5 10.5h2M13.5 10.5h2M9.5 14.5c1.5 1 3.5 1 5 0"/></svg> 面具 </button> <button class="tab" data-page="preset"> <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg> 预设 </button> <button class="tab" data-page="settings"> <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg> 设置 </button> </nav> <script> // ---------- 切换页面 ---------- const tabs = document.querySelectorAll('.tab'); const pages = document.querySelectorAll('.page'); function showPage(name) { pages.forEach(p => p.classList.toggle('active', p.id === 'page-' + name)); tabs.forEach(t => t.classList.toggle('active', t.dataset.page === name)); try { localStorage.setItem('lastPage', name); } catch (e) {} // 记住上次停在哪页 } tabs.forEach(t => t.addEventListener('click', () => showPage(t.dataset.page))); let last = 'world'; try { last = localStorage.getItem('lastPage') || 'world'; } catch (e) {} showPage(last); // ---------- 世界页：先做个回显，确认输入框能用 ---------- const log = document.getElementById('log'); const input = document.getElementById('input'); function addMsg(text, who) { const div = document.createElement('div'); div.className = 'msg ' + who; div.textContent = text; // 用 textContent，防止内容被当成网页代码执行 log.appendChild(div); log.scrollTop = log.scrollHeight; } function send() { const text = input.value.trim(); if (!text) return; addMsg(text, 'user'); addMsg('（收到：' + text + '）', 'sys'); input.value = ''; } document.getElementById('send').addEventListener('click', send); </script> </body> </html>
