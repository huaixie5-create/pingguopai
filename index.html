<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文游</title>

<!-- ============================================================
  第 1 步：骨架
  这个文件分三块：
    1. <style>  管长相（颜色、布局）
    2. <body>   管内容（四个页面 + 底栏）
    3. <script> 管行为（点底栏切换页面）
  后面每一步，我们都只是往这三块里加东西。
============================================================ -->

<style>
  /* ---------- 颜色和字体：想换风格，改这里就行 ---------- */
  :root {
    --paper:  #EEF2EE;   /* 页面底色，淡淡的梨花青白 */
    --card:   #FAFBF9;   /* 卡片、输入框的底色 */
    --ink:    #262B28;   /* 正文墨色 */
    --soft:   #6B746E;   /* 次要文字 */
    --line:   #D5DCD6;   /* 分割线 */
    --accent: #4F6F62;   /* 强调色，青灰绿 */
    --title-font: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;                 /* 手机上刚好一屏高 */
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  /* ---------- 页面区域 ---------- */
  main { flex: 1; min-height: 0; position: relative; }

  .page {
    display: none;                  /* 默认都藏起来 */
    flex-direction: column;
    height: 100%;
  }
  .page.active { display: flex; }   /* 只有带 active 的显示 */

  .page-head {
    padding: 18px 20px 12px;
    padding-top: max(18px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
  }
  .page-head h1 {
    font-family: var(--title-font);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.12em;
  }
  .page-head p { font-size: 14px; color: var(--soft); }

  .head-row { display: flex; justify-content: space-between; align-items: center; }
  .btn.small { padding: 6px 14px; font-size: 14px; }

  .page-body { flex: 1; overflow-y: auto; padding: 20px; }

  /* 空页面时的提示 */
  .empty {
    margin-top: 12vh;
    text-align: center;
    color: var(--soft);
    font-size: 15px;
  }
  .empty strong {
    display: block;
    margin-bottom: 6px;
    font-family: var(--title-font);
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }

  /* ---------- 世界页：消息 + 输入框 ---------- */
  .log { flex: 1; overflow-y: auto; padding: 16px 20px; }

  .msg {
    max-width: 85%;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;          /* 保留换行 */
    word-break: break-word;
  }
  .msg.user { margin-left: auto; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.sys  { margin-right: auto; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.err  { margin-right: auto; background: #F6E4E0; border: 1px solid #E3BFB8; color: #8C2F22; border-bottom-left-radius: 4px; }

  .composer {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    background: var(--paper);
  }
  .composer textarea {
    flex: 1;
    max-height: 120px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    font: inherit;                  /* 16px，iPhone 不会自动放大页面 */
    resize: none;
  }
  .composer button {
    padding: 10px 18px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }

  /* ---------- 底栏 ---------- */
  nav {
    display: flex;
    border-top: 1px solid var(--line);
    background: var(--card);
    padding-bottom: env(safe-area-inset-bottom);  /* 避开手机底部小横条 */
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 10px 0 8px;
    border: 0;
    background: none;
    color: var(--soft);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tab.active { color: var(--accent); font-weight: 600; }

  /* ---------- 设置页：表单 ---------- */
  .field { margin-bottom: 22px; }
  .field label { display: block; margin-bottom: 6px; font-weight: 600; }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    font: inherit;
  }
  .row { display: flex; gap: 10px; }
  .hint { margin-top: 6px; font-size: 13px; color: var(--soft); line-height: 1.5; }

  .btn {
    padding: 10px 18px;
    border: 1px solid var(--accent);
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    white-space: nowrap;
    cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .model-picker {
    margin-top: 8px;
    max-height: 240px;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
  }
  .model-picker[hidden] { display: none; }
  .model-item {
    display: block;
    width: 100%;
    padding: 12px;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: none;
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .model-item:last-child { border-bottom: 0; }
  .model-item.current { color: var(--accent); font-weight: 600; }

  .actions { display: flex; gap: 10px; }
  .actions .btn { flex: 1; }

  .result { margin-top: 16px; font-size: 14px; word-break: break-word; }
  .result.ok  { color: #2F6B4B; }
  .result.err { color: #A33A2B; }

  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>

<body>

<div id="status" style="display:none;flex:none;padding:4px 12px;font-size:12px;background:#F3D9D4;color:#7A2B20;text-align:center"></div>

<main>
  <!-- ========== 世界 ========== -->
  <section class="page active" id="page-world">
    <header class="page-head head-row">
      <h1>世界</h1>
      <button class="btn ghost small" id="clear" type="button">清空</button>
    </header>
    <div class="log" id="log"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="输入指令……"></textarea>
      <button id="send">发送</button>
    </div>
  </section>

  <!-- ========== 面具 ========== -->
  <section class="page" id="page-mask">
    <header class="page-head">
      <h1>面具</h1>
      <p>存放你扮演的人设</p>
    </header>
    <div class="page-body">
      <div class="empty"><strong>还没有面具</strong>第 4 步会在这里新建和管理人设。</div>
    </div>
  </section>

  <!-- ========== 预设 ========== -->
  <section class="page" id="page-preset">
    <header class="page-head">
      <h1>预设</h1>
      <p>导入、导出、编辑酒馆格式预设</p>
    </header>
    <div class="page-body">
      <div class="empty"><strong>还没有预设</strong>第 5 步会在这里导入酒馆 JSON，并编辑条目。</div>
    </div>
  </section>

  <!-- ========== 设置 ========== -->
  <section class="page" id="page-settings">
    <header class="page-head">
      <h1>设置</h1>
      <p>连接 API（OpenAI 格式）</p>
    </header>
    <div class="page-body">
      <div class="field">
        <label for="cfg-url">API 地址</label>
        <input id="cfg-url" type="url" inputmode="url" placeholder="https://api.openai.com/v1"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <p class="hint">填到 /v1 为止，末尾不用加 /chat/completions。</p>
      </div>

      <div class="field">
        <label for="cfg-key">API Key</label>
        <div class="row">
          <input id="cfg-key" type="password" placeholder="sk-……"
                 autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="btn ghost" id="toggle-key" type="button">显示</button>
        </div>
        <p class="hint">只保存在这台手机的浏览器里，只会发给你填的 API 地址。</p>
      </div>

      <div class="field">
        <label for="cfg-model">模型名</label>
        <div class="row">
          <input id="cfg-model" placeholder="例如 gpt-4o"
                 autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="btn ghost" id="fetch-models" type="button">获取列表</button>
        </div>
        <div class="model-picker" id="model-picker" hidden></div>
        <p class="hint">点「获取列表」后，下面会出现模型列表，点一下就能选。也可以直接打字来筛选。</p>
      </div>

      <div class="actions">
        <button class="btn" id="save" type="button">保存</button>
        <button class="btn ghost" id="test" type="button">测试连接</button>
      </div>
      <p class="result" id="cfg-result"></p>
    </div>
  </section>
</main>

<!-- ========== 底栏 ========== -->
<nav>
  <button class="tab" data-page="world">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
    世界
  </button>
  <button class="tab" data-page="mask">
    <svg viewBox="0 0 24 24"><path d="M4 5c5 2 11 2 16 0v6c0 5-3.5 8-8 8s-8-3-8-8z"/><path d="M8.5 10.5h2M13.5 10.5h2M9.5 14.5c1.5 1 3.5 1 5 0"/></svg>
    面具
  </button>
  <button class="tab" data-page="preset">
    <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
    预设
  </button>
  <button class="tab" data-page="settings">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    设置
  </button>
</nav>

<script>
  // ---------- 出错时，顶部会弹出红色提示条，方便我们排查 ----------
  const statusBar = document.getElementById('status');
  window.onerror = function (msg, src, line) {
    statusBar.textContent = '出错了：' + msg + '（第 ' + line + ' 行）';
    statusBar.style.display = 'block';
  };

  // ---------- 切换页面 ----------
  const tabs  = document.querySelectorAll('.tab');
  const pages = document.querySelectorAll('.page');

  function showPage(name) {
    pages.forEach(p => p.classList.toggle('active', p.id === 'page-' + name));
    tabs.forEach(t => t.classList.toggle('active', t.dataset.page === name));
    try { localStorage.setItem('lastPage', name); } catch (e) {}   // 记住上次停在哪页
  }

  tabs.forEach(t => t.addEventListener('click', () => showPage(t.dataset.page)));

  let last = 'world';
  try { last = localStorage.getItem('lastPage') || 'world'; } catch (e) {}
  showPage(last);

  // ============================================================
  //  第 3 步：世界页真正调用 AI
  // ============================================================
  const HISTORY_KEY = 'wenyou.history';

  // 临时的系统提示词。第 5、6 步做完预设后，会换成你导入的预设。
  const DEFAULT_SYSTEM = '你是一个文字冒险游戏的叙述者。根据玩家输入的指令，用生动的第二人称描写接下来发生的事，并留出让玩家继续行动的空间。';

  const log     = document.getElementById('log');
  const input   = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  // 聊天记录：[{ role: 'user' 或 'assistant', content: '文字' }, ...]
  let history = [];
  try { history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) {}
  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  }

  // 往屏幕上加一个气泡。cls 是 'user'（你）、'sys'（AI）或 'err'（错误）
  function addMsg(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;          // 用 textContent，防止内容被当成网页代码执行
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  // 把所有记录重新画一遍（打开页面、清空时用）
  function renderHistory() {
    log.innerHTML = '';
    if (history.length === 0) {
      addMsg('欢迎来到这里。先到「设置」页填好 API，然后输入一条指令开始。', 'sys');
    }
    history.forEach(m => addMsg(m.content, m.role === 'user' ? 'user' : 'sys'));
  }
  renderHistory();

  // 输入框随内容变高（最高 120px）
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', autoGrow);

  // 发送指令
  let busy = false;                  // 正在等 AI 回复时，不允许重复发送
  async function send() {
    if (busy) return;
    const text = input.value.trim();
    if (!text) return;

    log.querySelectorAll('.msg.err').forEach(e => e.remove());   // 清掉上一次的错误提示

    const s = loadSettings();
    if (!s.baseUrl || !s.apiKey || !s.model) {
      addMsg('还没有连接 API。请先到「设置」页填好地址、Key 和模型名。', 'err');
      return;
    }

    busy = true;
    sendBtn.disabled = true;
    if (history.length === 0) log.innerHTML = '';                // 去掉欢迎语

    history.push({ role: 'user', content: text });
    const userDiv = addMsg(text, 'user');
    input.value = '';
    autoGrow();
    const pending = addMsg('……', 'sys');                         // AI 回复前先占个位

    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 180000);        // 最多等 3 分钟

    try {
      const res = await fetch(s.baseUrl + '/chat/completions', {
        method: 'POST',
        signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.apiKey },
        body: JSON.stringify({
          model: s.model,
          messages: [{ role: 'system', content: DEFAULT_SYSTEM }, ...history]
        })
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error('（' + res.status + '）' + errorText(data));

      const reply = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (!reply) throw new Error('模型没有返回内容');

      history.push({ role: 'assistant', content: reply });
      saveHistory();
      pending.textContent = reply;
    } catch (e) {
      history.pop();                 // 失败了：撤回刚才那条指令，文字放回输入框方便重发
      userDiv.remove();
      input.value = text;
      autoGrow();
      pending.className = 'msg err';
      pending.textContent = '出错了：' + (e.name === 'AbortError' ? '等太久了，已中断。' : e.message);
    } finally {
      clearTimeout(timer);
      busy = false;
      sendBtn.disabled = false;
      log.scrollTop = log.scrollHeight;
    }
  }

  sendBtn.addEventListener('click', send);

  // 清空记录，重新开始
  document.getElementById('clear').addEventListener('click', function () {
    if (history.length === 0) return;
    if (confirm('清空当前的游戏记录，重新开始？')) {
      history = [];
      saveHistory();
      renderHistory();
    }
  });


  // ============================================================
  //  第 2 步：设置页（API 地址 / Key / 模型名）
  // ============================================================
  const SETTINGS_KEY = 'wenyou.settings';      // 存在浏览器里的名字

  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveSettings(s) {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); return true; }
    catch (e) { return false; }
  }

  const cfgUrl    = document.getElementById('cfg-url');
  const cfgKey    = document.getElementById('cfg-key');
  const cfgModel  = document.getElementById('cfg-model');
  const cfgResult = document.getElementById('cfg-result');
  const modelPicker = document.getElementById('model-picker');

  // 打开页面时，把之前存的内容填回输入框
  const saved = loadSettings();
  cfgUrl.value   = saved.baseUrl || '';
  cfgKey.value   = saved.apiKey  || '';
  cfgModel.value = saved.model   || '';

  // 读取输入框当前内容（地址末尾多余的 / 会去掉）
  function readForm() {
    return {
      baseUrl: cfgUrl.value.trim().replace(/\/+$/, ''),
      apiKey:  cfgKey.value.trim(),
      model:   cfgModel.value.trim()
    };
  }

  function showResult(text, ok) {
    cfgResult.textContent = text;
    cfgResult.className = 'result ' + (ok ? 'ok' : 'err');
  }

  // ---------- 模型列表：点一下就能选 ----------
  const MODELS_KEY = 'wenyou.models';
  let modelIds = [];
  try { modelIds = JSON.parse(localStorage.getItem(MODELS_KEY)) || []; } catch (e) {}

  function renderModels() {
    const typed = cfgModel.value.trim().toLowerCase();
    const exact = modelIds.some(id => id.toLowerCase() === typed);
    // 输入框里有字、又不是完整的模型名时，按输入内容筛选
    const shown = (typed && !exact) ? modelIds.filter(id => id.toLowerCase().includes(typed)) : modelIds;
    modelPicker.innerHTML = '';
    shown.forEach(id => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'model-item' + (id.toLowerCase() === typed ? ' current' : '');
      b.textContent = id;
      b.addEventListener('click', () => {
        cfgModel.value = id;
        cfgModel.blur();
        modelPicker.hidden = true;
      });
      modelPicker.appendChild(b);
    });
    modelPicker.hidden = shown.length === 0;
  }
  cfgModel.addEventListener('focus', renderModels);
  cfgModel.addEventListener('input', renderModels);

  // 显示 / 隐藏 Key
  document.getElementById('toggle-key').addEventListener('click', function () {
    const hidden = cfgKey.type === 'password';
    cfgKey.type = hidden ? 'text' : 'password';
    this.textContent = hidden ? '隐藏' : '显示';
  });

  // 保存
  document.getElementById('save').addEventListener('click', function () {
    const ok = saveSettings(readForm());
    showResult(ok ? '已保存。' : '保存失败，浏览器不允许存储。', ok);
  });

  // 获取模型列表
  document.getElementById('fetch-models').addEventListener('click', async function () {
    const s = readForm();
    if (!s.baseUrl || !s.apiKey) { showResult('请先填好 API 地址和 Key。', false); return; }
    showResult('获取中……', true);
    try {
      const res  = await fetch(s.baseUrl + '/models', { headers: { 'Authorization': 'Bearer ' + s.apiKey } });
      const data = await res.json().catch(() => null);
      if (!res.ok) { showResult('获取失败（' + res.status + '）：' + errorText(data), false); return; }
      const ids = ((data && data.data) || []).map(m => m.id).filter(Boolean);
      modelIds = ids;
      try { localStorage.setItem(MODELS_KEY, JSON.stringify(ids)); } catch (e) {}
      renderModels();
      showResult('获取到 ' + ids.length + ' 个模型，点下面的列表选择。', ids.length > 0);
    } catch (e) {
      showResult('连不上：' + e.message + '。请检查地址，以及网络/VPN。', false);
    }
  });

  // 测试连接：发一句「你好」，看模型有没有回
  document.getElementById('test').addEventListener('click', async function () {
    const s = readForm();
    if (!s.baseUrl || !s.apiKey || !s.model) { showResult('请先把地址、Key、模型名都填上。', false); return; }
    showResult('测试中……', true);
    try {
      const res = await fetch(s.baseUrl + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.apiKey },
        body: JSON.stringify({ model: s.model, messages: [{ role: 'user', content: '你好' }] })
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) { showResult('连接失败（' + res.status + '）：' + errorText(data), false); return; }
      const reply = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      showResult('连接成功。模型回复：' + (reply || '（空）'), true);
    } catch (e) {
      showResult('连不上：' + e.message + '。请检查地址，以及网络/VPN。', false);
    }
  });

  // 从 API 返回的错误里取出人能看懂的文字
  function errorText(data) {
    return (data && data.error && (data.error.message || data.error)) || '未知错误';
  }
</script>

</body>
</html>
